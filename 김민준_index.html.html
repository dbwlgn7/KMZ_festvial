<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clean the Outliers: Precision</title>
    <style>
        :root { --primary: #007AFF; --danger: #FF3B30; --success: #4CD964; --frost: #00CCFF; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: #0a0a0b; color: white; overflow: hidden; touch-action: none; }
        .screen { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #game-screen { display: none; background: #fdfdfd; color: #333; }
        #result-screen { display: none; background: rgba(0,0,0,0.95); z-index: 100; }

        /* UI */
        #top-bar { position: absolute; top: 14px; width: 90%; display: flex; justify-content: space-between; font-weight: bold; z-index: 60; }
        #item-bar { position: absolute; top: 54px; width: 90%; display: flex; justify-content: center; align-items: center; gap: 10px; z-index: 60; }
        .item-slot {
            width: 50px; height: 50px; border-radius: 14px; background: rgba(0,0,0,0.06);
            border: 2px dashed rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center;
            font-size: 1.7rem; cursor: pointer; transition: transform 0.1s;
        }
        .item-slot.filled { border-style: solid; border-color: var(--primary); background: rgba(0,122,255,0.10); }
        .item-slot.filled:active { transform: scale(0.9); }
        .item-slot.hidden { display: none; }
        #pending-badge { position: absolute; top: 108px; font-size: 0.75rem; color: #888; z-index: 60; }

        #chart-container { width: 90%; height: 60px; background: #eee; border-radius: 30px; margin-top: 118px; position: relative; overflow: hidden; border: 3px solid #ccc; }
        #target-zone { position: absolute; height: 100%; background: rgba(76, 217, 100, 0.3); border-left: 2px solid var(--success); border-right: 2px solid var(--success); transition: all 0.5s; }
        #bar { position: absolute; left: 0; width: 0%; height: 100%; background: var(--success); transition: width 0.3s; }
        #center-line { position: absolute; left: 50%; width: 2px; height: 100%; background: rgba(0,0,0,0.2); z-index: 4; }
        #field { width: 100%; flex-grow: 1; position: relative; touch-action: none; overflow: hidden; }

        /* 이모지 래퍼: x,y는 항상 "중심점" 기준(translate로 중앙 정렬). 터치 판정 범위는 width/height로 넓힘 */
        .emoji-wrapper {
            position: absolute; display: flex; align-items: center; justify-content: center;
            transform: translate(-50%, -50%);
            cursor: pointer; touch-action: none; user-select: none;
            transition: width 0.15s ease, height 0.15s ease;
        }
        .emoji-wrapper.organize-move { transition: left 0.6s ease, top 0.6s ease, width 0.15s ease, height 0.15s ease !important; }
        .icon { user-select: none; transition: transform 0.12s, opacity 0.12s; line-height: 1; }

        /* 이상치 디자인 */
        .outlier-high { font-size: 4rem; filter: drop-shadow(0 0 15px var(--danger)); }
        .outlier-low { font-size: 4.5rem; filter: drop-shadow(0 0 20px var(--frost)); }
        .bomb-icon { font-size: 4.2rem; filter: drop-shadow(0 0 18px #ff9500); }
        .bomb-timer {
            position: absolute; top: -16px; right: -10px;
            background: #1a1a1a; color: #fff; font-weight: 900; font-size: 0.85rem;
            padding: 2px 7px; border-radius: 10px; border: 2px solid #ff9500;
            pointer-events: none; white-space: nowrap;
        }
        .icon.normal { font-size: 3rem; }
        .mega-bomb {
            font-size: 7rem;
            filter: drop-shadow(0 0 30px #ff0000) hue-rotate(320deg);
            animation: pulse-bomb 0.8s infinite ease-in-out alternate;
        }
        @keyframes pulse-bomb { 0% { transform: scale(1); } 100% { transform: scale(1.25); } }

        .frost-aura {
            position: absolute; border-radius: 50%; background: rgba(0, 204, 255, 0.1);
            border: 2px dashed var(--frost); pointer-events: none; transform: translate(-50%, -50%);
        }
        .frozen { filter: grayscale(1) contrast(0.5) !important; pointer-events: none !important; }

        .blast-ring { position: absolute; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); }
        .blast-ring-inner { border: 2px solid rgba(255, 59, 0, 0.55); background: rgba(255, 59, 0, 0.06); z-index: 3; }
        .blast-ring-outer { border: 2px dashed rgba(255, 149, 0, 0.45); z-index: 2; }

        .blast-fx {
            position: absolute; left: 0; top: 0; width: 10px; height: 10px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,225,140,0.95), rgba(255,120,0,0.7) 40%, rgba(255,0,0,0) 72%);
            transform: translate(-50%, -50%);
            animation: blast-expand 0.5s ease-out forwards;
            z-index: 200; pointer-events: none;
        }
        @keyframes blast-expand { 0% { width: 10px; height: 10px; opacity: 1; } 100% { width: 340px; height: 340px; opacity: 0; } }

        .gift-fx {
            position: absolute; left: 0; top: 0; width: 10px; height: 10px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,210,0.95), rgba(255,205,60,0.6) 45%, rgba(255,205,60,0) 72%);
            transform: translate(-50%, -50%);
            animation: gift-pop 0.5s ease-out forwards;
            z-index: 210; pointer-events: none;
        }
        @keyframes gift-pop { 0% { width: 10px; height: 10px; opacity: 1; } 100% { width: 170px; height: 170px; opacity: 0; } }

        .group-label {
            position: absolute; top: 3%; transform: translate(-50%, 0);
            background: rgba(0,0,0,0.75); color: #fff; padding: 4px 10px; border-radius: 12px;
            font-weight: 800; font-size: 0.85rem; z-index: 400; pointer-events: none; white-space: nowrap;
        }

        button { padding: 15px 50px; font-size: 1.2rem; border: none; background: var(--primary); color: white; border-radius: 30px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="start-screen" class="screen">
        <h1 style="font-size: 3rem;">🧼 STAGE <span id="start-lv">1</span></h1>
        <p id="goal-text">평균을 15~35로 유지하세요!</p>
        <button onclick="start(1)">데이터 정제 시작</button>
    </div>

    <div id="game-screen" class="screen">
        <div id="top-bar">
            <div>LV.<span id="lv-display">1</span></div>
            <div id="timer">15.0s</div>
        </div>
        <div id="item-bar">
            <div class="item-slot" data-idx="0"></div>
            <div class="item-slot" data-idx="1"></div>
            <div class="item-slot" data-idx="2"></div>
        </div>
        <div id="pending-badge" style="display:none;"></div>
        <div id="chart-container">
            <div id="target-zone"></div>
            <div id="bar"></div>
            <div id="center-line"></div>
        </div>
        <div id="avg-text" style="font-weight: 900; margin-top: 10px; font-size: 1.5rem;">평균: 0</div>
        <div id="field"></div>
    </div>

    <div id="result-screen" class="screen">
        <h1 id="res-title">SUCCESS</h1>
        <p id="res-desc"></p>
        <button onclick="nextStage()">다음 스테이지</button>
    </div>

<script>
    let stage = 1;
    let timeLeft = 15;
    let gameLoop, spawnLoop, physicsLoop, giftTimeout, hourglassTimeout;
    let emojis = [];
    let idCounter = 1;
    let targetMin = 15, targetMax = 35;
    let lastWin = false;

    // 종류별 터치 판정 박스 크기(px). x,y는 이 박스의 "중심".
    const WRAPPER_SIZE = { normal: 66, pepper: 92, bomb: 112, mega: 132 };
    const ICE_HITS_NEEDED = 3;
    const ICE_BASE_SIZE = 140;   // 얼음만 터치범위를 넓게
    const ICE_CORE_SIZE = 72;
    const ICE_SPEED_MULT = 0.45; // 얼음은 다른 이상치보다 느리게 이동

    const Z_INDEX = { normal: 5, pepper: 6, bomb: 20, ice: 50, mega: 100 };

    const FREEZE_RADIUS = 16;
    const BLAST_RADIUS = 22;
    const PUSH_RADIUS = 42;
    const DRAG_THRESHOLD = 8;
    const BOMB_COUNTDOWN_SEC = 5; // 폭탄은 항상 5초

    let pointerCandidate = null; // { obj, startX, startY, dragging, coreHit }
    let sweepActive = false;
    let sweepVisited = new Set();

    // ===== 전역 속도 배율 (모래시계 아이템용) =====
    let timeScale = 1;

    // ===== 선물상자 / 아이템 시스템 =====
    let giftSpawnedThisStage = false;
    const ITEM_GLYPH = { hourglass: '⏳', crystal: '🔮', flower: '🌼', bombItem: '💣', slot: '🎰' };
    const ITEM_POOL = [
        { type: 'hourglass', w: 40 },
        { type: 'crystal', w: 25 },
        { type: 'flower', w: 20 },
        { type: 'bombItem', w: 10 },
        { type: 'slot', w: 5 }
    ];
    let itemCapacity = 1;
    let itemSlots = [null, null, null];
    let pendingItem = null;
    let explosiveTouchUntil = 0;
    const ORGANIZE_DURATION = 6000;

    function start(s) {
        stage = s; timeLeft = 15; emojis = [];
        pointerCandidate = null; sweepActive = false; sweepVisited = new Set();
        giftSpawnedThisStage = false;
        clearInterval(gameLoop); clearInterval(spawnLoop); clearInterval(physicsLoop);
        clearTimeout(giftTimeout);

        if (stage >= 7) {
            targetMin = 20; targetMax = 30;
            document.getElementById('goal-text').innerText = "정밀 모드: 평균을 20~30으로 유지하세요!";
        } else {
            targetMin = 15; targetMax = 35;
            document.getElementById('goal-text').innerText = "평균을 15~35로 유지하세요!";
        }

        const tz = document.getElementById('target-zone');
        tz.style.left = targetMin + '%';
        tz.style.width = (targetMax - targetMin) + '%';

        document.getElementById('lv-display').innerText = stage;
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';

        document.getElementById('field').innerHTML = '';
        for (let i = 0; i < 15; i++) createEmoji(false);

        // 스테이지마다 최대 한 개, 작은 확률로 선물상자 등장 예약
        if (Math.random() < 0.35) {
            const delay = 2000 + Math.random() * 9000;
            giftTimeout = setTimeout(trySpawnGift, delay);
        }

        gameLoop = setInterval(() => {
            timeLeft -= 0.1 * timeScale;
            document.getElementById('timer').innerText = Math.max(0, timeLeft).toFixed(1) + 's';
            if (timeLeft <= 0) finish();
            checkFrostShield();
            checkBombTimers();
        }, 100);

        restartSpawnLoop();
        physicsLoop = setInterval(physicsTick, 30);
    }

    function restartSpawnLoop() {
        clearInterval(spawnLoop);
        const baseInterval = Math.max(200, 800 - (stage * 60));
        spawnLoop = setInterval(() => createEmoji(Math.random() > 0.4), baseInterval / timeScale);
    }

    function createEmoji(isOutlier) {
        let val;
        let type = 'normal';

        if (isOutlier && stage >= 7 && Math.random() < 0.01) {
            val = 1000; type = 'mega';
        } else if (isOutlier) {
            if (Math.random() > 0.5) {
                val = 100;
                const bombChance = Math.min(0.6, 0.25 + stage * 0.03);
                type = Math.random() < bombChance ? 'bomb' : 'pepper';
            } else {
                val = 2; type = 'ice';
            }
        } else {
            val = Math.floor(Math.random() * 11) + 20;
            type = 'normal';
        }

        const x = Math.random() * 80 + 10;
        const y = Math.random() * 80 + 10;
        const field = document.getElementById('field');

        const wrapper = document.createElement('div');
        wrapper.className = 'emoji-wrapper';
        const boxSize = type === 'ice' ? ICE_BASE_SIZE : WRAPPER_SIZE[type];
        wrapper.style.width = boxSize + 'px';
        wrapper.style.height = boxSize + 'px';
        wrapper.style.left = x + '%';
        wrapper.style.top = y + '%';
        wrapper.style.zIndex = Z_INDEX[type];
        wrapper.style.cursor = type === 'bomb' ? 'grab' : 'pointer';

        const icon = document.createElement('div');
        let glyph = '';
        let iconClass = 'icon';
        if (type === 'mega') { iconClass += ' mega-bomb'; glyph = '💀'; }
        else if (type === 'pepper') { iconClass += ' outlier-high'; glyph = '🌶️'; }
        else if (type === 'bomb') { iconClass += ' bomb-icon'; glyph = '💣'; }
        else if (type === 'ice') { iconClass += ' outlier-low'; glyph = '❄️'; }
        else { iconClass += ' normal'; glyph = ['🍏', '🥦', '🥑'][Math.floor(Math.random() * 3)]; }
        icon.className = iconClass;
        icon.innerText = glyph;
        wrapper.appendChild(icon);

        let timerEl = null;
        if (type === 'bomb') {
            timerEl = document.createElement('div');
            timerEl.className = 'bomb-timer';
            wrapper.appendChild(timerEl);
        }

        let aura = null;
        if (type === 'ice' && stage >= 5) {
            aura = document.createElement('div');
            aura.className = 'frost-aura';
            const d = FREEZE_RADIUS * 2;
            aura.style.width = d + '%';
            aura.style.height = d + '%';
            aura.style.left = x + '%';
            aura.style.top = y + '%';
            field.appendChild(aura);
        }

        let blastRing = null, pushRing = null;
        if (type === 'bomb') {
            blastRing = document.createElement('div');
            blastRing.className = 'blast-ring blast-ring-inner';
            blastRing.style.width = (BLAST_RADIUS * 2) + '%';
            blastRing.style.height = (BLAST_RADIUS * 2) + '%';
            blastRing.style.left = x + '%';
            blastRing.style.top = y + '%';
            field.appendChild(blastRing);

            pushRing = document.createElement('div');
            pushRing.className = 'blast-ring blast-ring-outer';
            pushRing.style.width = (PUSH_RADIUS * 2) + '%';
            pushRing.style.height = (PUSH_RADIUS * 2) + '%';
            pushRing.style.left = x + '%';
            pushRing.style.top = y + '%';
            field.appendChild(pushRing);
        }

        field.appendChild(wrapper);

        const obj = {
            id: idCounter++,
            el: wrapper, icon, timerEl, aura, blastRing, pushRing,
            type, val, isOutlier,
            x, y,
            vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4,
            hitCount: 0, hitsNeeded: ICE_HITS_NEEDED,
            removed: false, exploded: false, held: false,
            flung: false, flingRemainingMs: 0, chainRemainingMs: null,
            organizedUntil: 0
        };

        if (type === 'bomb') {
            obj.remainingMs = BOMB_COUNTDOWN_SEC * 1000;
            timerEl.innerText = BOMB_COUNTDOWN_SEC.toFixed(1) + 's';
        }

        wrapper.dataset.id = obj.id;
        emojis.push(obj);
        updateChart();
        return obj;
    }

    function findEmojiFromElement(el) {
        let node = el;
        while (node && node !== document.body) {
            if (node.dataset && node.dataset.id) {
                return emojis.find(e => e.id == node.dataset.id);
            }
            node = node.parentElement;
        }
        return null;
    }

    function positionEl(obj) {
        obj.el.style.left = obj.x + '%';
        obj.el.style.top = obj.y + '%';
        if (obj.aura) { obj.aura.style.left = obj.x + '%'; obj.aura.style.top = obj.y + '%'; }
        if (obj.blastRing) { obj.blastRing.style.left = obj.x + '%'; obj.blastRing.style.top = obj.y + '%'; }
        if (obj.pushRing) { obj.pushRing.style.left = obj.x + '%'; obj.pushRing.style.top = obj.y + '%'; }
    }

    function updateIceVisual(obj) {
        const remain = obj.hitsNeeded - obj.hitCount;
        const size = ICE_CORE_SIZE + (ICE_BASE_SIZE - ICE_CORE_SIZE) * (remain / obj.hitsNeeded);
        obj.el.style.width = size + 'px';
        obj.el.style.height = size + 'px';
        obj.icon.style.transform = 'scale(1.18)';
        obj.icon.style.opacity = Math.max(0.5, remain / obj.hitsNeeded);
        setTimeout(() => { if (obj.icon) obj.icon.style.transform = 'scale(1)'; }, 110);
    }

    // 범위 안에 얼음이 여러 개 겹쳐 있으면 한 번의 터치로 전부 같이 맞도록 처리
    function hitNearbyIce(originObj, clientX, clientY, coreHit) {
        handleHit(originObj, coreHit);
        const rect = fieldEl.getBoundingClientRect();
        const px = (clientX - rect.left) / rect.width * 100;
        const py = (clientY - rect.top) / rect.height * 100;
        const radiusPercent = (ICE_BASE_SIZE / rect.width) * 100;
        [...emojis].forEach(e => {
            if (e === originObj || e.removed || e.exploded || e.type !== 'ice') return;
            const dist = Math.hypot(e.x - px, e.y - py);
            if (dist <= radiusPercent) handleHit(e, false);
        });
    }

    // coreHit=true면 아이콘을 직접 누른 것(얼음은 즉시 제거), false면 판정 범위를 누른 것(얼음은 3번 만에 제거)
    function handleHit(obj, coreHit) {
        if (!obj || obj.removed || obj.exploded) return;
        if (obj.type === 'ice') {
            if (coreHit) {
                removeEmoji(obj);
            } else {
                obj.hitCount++;
                updateIceVisual(obj);
                if (obj.hitCount >= obj.hitsNeeded) removeEmoji(obj);
            }
        } else {
            removeEmoji(obj);
        }
    }

    function removeEmoji(obj) {
        if (!obj || obj.removed) return;
        obj.removed = true;
        if (pointerCandidate && pointerCandidate.obj === obj) pointerCandidate = null;
        if (obj.el) obj.el.remove();
        if (obj.aura) obj.aura.remove();
        if (obj.blastRing) obj.blastRing.remove();
        if (obj.pushRing) obj.pushRing.remove();
        emojis = emojis.filter(item => item !== obj);
        updateChart();
    }

    function spawnBlastFx(cx, cy) {
        const fx = document.createElement('div');
        fx.className = 'blast-fx';
        fx.style.left = cx + '%';
        fx.style.top = cy + '%';
        const field = document.getElementById('field');
        if (field) field.appendChild(fx);
        setTimeout(() => fx.remove(), 520);
    }

    function spawnGiftFx(cx, cy) {
        const fx = document.createElement('div');
        fx.className = 'gift-fx';
        fx.style.left = cx + '%';
        fx.style.top = cy + '%';
        const field = document.getElementById('field');
        if (field) field.appendChild(fx);
        setTimeout(() => fx.remove(), 520);
    }

    function flingItem(e, cx, cy, isChain) {
        if (!e || e.removed) return;
        const dx = e.x - cx, dy = e.y - cy;
        const dist = Math.hypot(dx, dy) || 1;
        const power = isChain ? 7 : 3.5;
        e.vx = (dx / dist) * power + (Math.random() - 0.5) * 2;
        e.vy = (dy / dist) * power + (Math.random() - 0.5) * 2;
        e.flung = true;
        e.held = false;
        if (pointerCandidate && pointerCandidate.obj === e) pointerCandidate = null;
        e.flingRemainingMs = isChain ? 1000 : 650;
    }

    // 폭발은 obj.x/obj.y(이모지의 정확한 중심)를 기준으로 발생
    function explode(obj) {
        if (!obj || obj.exploded || obj.removed) return;
        obj.exploded = true;
        const cx = obj.x, cy = obj.y;
        if (pointerCandidate && pointerCandidate.obj === obj) pointerCandidate = null;

        spawnBlastFx(cx, cy);

        [...emojis].forEach(e => {
            if (e === obj || e.removed) return;
            const dist = Math.hypot(e.x - cx, e.y - cy);
            if (dist <= BLAST_RADIUS) {
                if (e.type === 'bomb' && !e.exploded) {
                    flingItem(e, cx, cy, true);
                    e.chainRemainingMs = 1000;
                } else {
                    removeEmoji(e);
                }
            } else if (dist <= PUSH_RADIUS) {
                flingItem(e, cx, cy, false);
            }
        });

        removeEmoji(obj);
    }

    // 💣 아이템 효과: 지정 좌표에서 폭탄과 동일한 폭발 판정을 발생시킴
    function explodeAtPoint(cx, cy) {
        spawnBlastFx(cx, cy);
        [...emojis].forEach(e => {
            if (e.removed) return;
            const dist = Math.hypot(e.x - cx, e.y - cy);
            if (dist <= BLAST_RADIUS) {
                if (e.type === 'bomb' && !e.exploded) {
                    flingItem(e, cx, cy, true);
                    e.chainRemainingMs = 1000;
                } else {
                    removeEmoji(e);
                }
            } else if (dist <= PUSH_RADIUS) {
                flingItem(e, cx, cy, false);
            }
        });
    }

    function checkBombTimers() {
        emojis.forEach(e => {
            if (e.type === 'bomb' && !e.exploded && e.chainRemainingMs == null) {
                if (e.el && e.el.classList.contains('frozen')) return; // 얼음 아래에서는 터지지 않음(카운트다운 멈춤)
                e.remainingMs -= 100 * timeScale;
                if (e.timerEl) e.timerEl.innerText = Math.max(0, e.remainingMs / 1000).toFixed(1) + 's';
                if (e.remainingMs <= 0) explode(e);
            }
        });
    }

    function physicsTick() {
        [...emojis].forEach(e => {
            if (e.removed) return;
            if (e.type === 'bomb' && e.chainRemainingMs != null && !e.exploded) {
                e.chainRemainingMs -= 30 * timeScale;
                if (e.chainRemainingMs <= 0) { explode(e); return; }
            }
            if (e.held) return;
            if (e.organizedUntil && Date.now() < e.organizedUntil) return;

            let moved = false;
            if (e.flung) {
                e.x += e.vx * timeScale; e.y += e.vy * timeScale;
                e.vx *= 0.93; e.vy *= 0.93;
                if (e.x < 3) { e.x = 3; e.vx = Math.abs(e.vx); }
                if (e.x > 97) { e.x = 97; e.vx = -Math.abs(e.vx); }
                if (e.y < 3) { e.y = 3; e.vy = Math.abs(e.vy); }
                if (e.y > 97) { e.y = 97; e.vy = -Math.abs(e.vy); }
                moved = true;
                e.flingRemainingMs -= 30 * timeScale;
                if (e.flingRemainingMs <= 0) {
                    e.flung = false;
                    e.vx = (Math.random() - 0.5) * 0.4;
                    e.vy = (Math.random() - 0.5) * 0.4;
                }
            } else if (stage >= 5 && e.isOutlier && e.type !== 'bomb') {
                const speed = (stage - 4) * 1.5 * timeScale * (e.type === 'ice' ? ICE_SPEED_MULT : 1);
                e.x += e.vx * speed; e.y += e.vy * speed;
                if (e.x < 5 || e.x > 90) e.vx *= -1;
                if (e.y < 5 || e.y > 90) e.vy *= -1;
                moved = true;
            }
            if (moved) positionEl(e);
        });
    }

    function checkFrostShield() {
        if (stage < 5) return;
        const snows = emojis.filter(e => e.type === 'ice' && !e.removed);
        emojis.forEach(e => {
            if (e.type === 'ice') { e.el.classList.remove('frozen'); return; }
            const isNear = snows.some(s => Math.hypot(e.x - s.x, e.y - s.y) < FREEZE_RADIUS);
            if (isNear) e.el.classList.add('frozen'); else e.el.classList.remove('frozen');
        });
    }

    function updateChart() {
        const vals = emojis.filter(e => !e.removed).map(e => e.val);
        if (vals.length === 0) return;
        const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
        const bar = document.getElementById('bar');
        bar.style.width = Math.min(avg, 100) + '%';
        bar.style.background = (avg >= targetMin && avg <= targetMax) ? 'var(--success)' : 'var(--danger)';
        document.getElementById('avg-text').innerText = `평균: ${avg.toFixed(1)}`;
    }

    function finish() {
        clearInterval(gameLoop); clearInterval(spawnLoop); clearInterval(physicsLoop);
        clearTimeout(giftTimeout);
        const vals = emojis.filter(e => !e.removed).map(e => e.val);
        const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
        const win = avg >= targetMin && avg <= targetMax;
        lastWin = win;
        document.getElementById('result-screen').style.display = 'flex';
        document.getElementById('res-title').innerText = win ? "STAGE CLEAR!" : "GAME OVER";
        document.getElementById('res-title').style.color = win ? 'var(--success)' : 'var(--danger)';
        document.getElementById('res-desc').innerText = `최종 평균: ${avg.toFixed(1)} (목표: ${targetMin}~${targetMax})`;
    }

    function nextStage() {
        if (lastWin) start(stage + 1);
        else start(stage);
    }

    // ===== 선물상자 =====
    function trySpawnGift() {
        if (giftSpawnedThisStage) return;
        giftSpawnedThisStage = true;

        const candidates = emojis.filter(e => !e.removed && (e.type === 'pepper' || e.type === 'ice' || e.type === 'bomb' || e.type === 'mega'));
        let targetX, targetY, targetObj = null;
        if (candidates.length && Math.random() < 0.85) {
            targetObj = candidates[Math.floor(Math.random() * candidates.length)];
            targetX = targetObj.x; targetY = targetObj.y;
        } else {
            targetX = Math.random() * 70 + 15;
            targetY = Math.random() * 70 + 15;
        }
        spawnGiftBox(targetX, targetY, targetObj);
    }

    function spawnGiftBox(targetX, targetY, targetObj) {
        const field = document.getElementById('field');
        const wrapper = document.createElement('div');
        wrapper.className = 'emoji-wrapper';
        wrapper.style.width = '68px';
        wrapper.style.height = '68px';
        wrapper.style.left = targetX + '%';
        wrapper.style.top = '-12%';
        wrapper.style.zIndex = 500;
        wrapper.style.pointerEvents = 'none';
        const icon = document.createElement('div');
        icon.className = 'icon';
        icon.style.fontSize = '3.1rem';
        icon.innerText = '🎁';
        wrapper.appendChild(icon);
        field.appendChild(wrapper);

        requestAnimationFrame(() => {
            wrapper.style.transition = 'top 0.7s cubic-bezier(.4,0,.6,1)';
            wrapper.style.top = targetY + '%';
        });

        setTimeout(() => {
            // 착지: 대상이 있으면(폭탄이든 이상치든) 터지지 않고 조용히 제거
            if (targetObj && !targetObj.removed) removeEmoji(targetObj);
            spawnGiftFx(targetX, targetY);
            grantRandomItem();
            wrapper.remove();
        }, 720);
    }

    function pickRandomItem(pool) {
        const total = pool.reduce((a, b) => a + b.w, 0);
        let r = Math.random() * total;
        for (const it of pool) { if (r < it.w) return it.type; r -= it.w; }
        return pool[0].type;
    }

    function grantRandomItem() {
        addItemToSlots(pickRandomItem(ITEM_POOL));
    }

    // 슬롯이 비어있으면 즉시 채움. 다 찼으면 사라지지 않고 대기(슬롯을 사용하면 자동으로 채워짐)
    function addItemToSlots(type) {
        for (let i = 0; i < itemCapacity; i++) {
            if (!itemSlots[i]) { itemSlots[i] = type; renderItemSlots(); return; }
        }
        pendingItem = type;
        renderItemSlots();
    }

    function renderItemSlots() {
        document.querySelectorAll('.item-slot').forEach((el) => {
            const i = parseInt(el.dataset.idx);
            if (i >= itemCapacity) { el.classList.add('hidden'); return; }
            el.classList.remove('hidden');
            const val = itemSlots[i];
            if (val) { el.classList.add('filled'); el.innerText = ITEM_GLYPH[val]; }
            else { el.classList.remove('filled'); el.innerText = ''; }
        });
        const badge = document.getElementById('pending-badge');
        if (pendingItem) { badge.style.display = 'block'; badge.innerText = `대기 아이템: ${ITEM_GLYPH[pendingItem]} (슬롯을 사용하면 자동으로 채워져요)`; }
        else { badge.style.display = 'none'; }
    }

    function useItem(idx) {
        const type = itemSlots[idx];
        if (!type) return;
        itemSlots[idx] = null;
        activateItem(type);
        if (pendingItem) { itemSlots[idx] = pendingItem; pendingItem = null; }
        if (itemCapacity === 3 && itemSlots.slice(0, 3).every(s => !s)) itemCapacity = 1;
        renderItemSlots();
    }

    function activateItem(type) {
        if (type === 'hourglass') {
            timeScale = 0.15;
            restartSpawnLoop();
            clearTimeout(hourglassTimeout);
            hourglassTimeout = setTimeout(() => { timeScale = 1; restartSpawnLoop(); }, 6000);
        } else if (type === 'crystal') {
            organizeOutliers();
        } else if (type === 'flower') {
            for (let i = 0; i < 7; i++) createEmoji(false);
        } else if (type === 'bombItem') {
            explosiveTouchUntil = Date.now() + 15000;
        } else if (type === 'slot') {
            itemCapacity = 3;
            const pool = ['hourglass', 'crystal', 'flower', 'bombItem'];
            itemSlots = [
                pool[Math.floor(Math.random() * pool.length)],
                pool[Math.floor(Math.random() * pool.length)],
                pool[Math.floor(Math.random() * pool.length)]
            ];
        }
    }

    // 🔮 크리스탈볼: 흩어진 데이터를 가로로 정리 (오른쪽=고추, 가운데=기본 채소, 왼쪽=얼음)
    function organizeOutliers() {
        const peppers = emojis.filter(e => e.type === 'pepper' && !e.removed);
        const normals = emojis.filter(e => e.type === 'normal' && !e.removed);
        const ices = emojis.filter(e => e.type === 'ice' && !e.removed);
        const until = Date.now() + ORGANIZE_DURATION;

        arrangeColumn(peppers, 88, until);
        arrangeCluster(normals, 50, until);
        arrangeColumn(ices, 12, until);

        showGroupLabel(88, `🌶️ ×${peppers.length}`);
        showGroupLabel(50, `🥦 ×${normals.length}`);
        showGroupLabel(12, `❄️ ×${ices.length}`);
    }

    function arrangeColumn(list, xPercent, until) {
        const n = list.length;
        list.forEach((e, i) => {
            e.el.classList.add('organize-move');
            e.x = xPercent;
            e.y = n <= 1 ? 50 : 15 + (70 * i / (n - 1));
            e.organizedUntil = until;
            positionEl(e);
        });
        setTimeout(() => list.forEach(e => { if (e.el) e.el.classList.remove('organize-move'); }), 750);
    }

    function arrangeCluster(list, xPercent, until) {
        const n = list.length;
        list.forEach((e, i) => {
            e.el.classList.add('organize-move');
            const angle = (i / Math.max(1, n)) * Math.PI * 2;
            const r = Math.min(14, n * 1.3);
            e.x = xPercent + Math.cos(angle) * r * 0.45;
            e.y = 50 + Math.sin(angle) * r * 0.45;
            e.organizedUntil = until;
            positionEl(e);
        });
        setTimeout(() => list.forEach(e => { if (e.el) e.el.classList.remove('organize-move'); }), 750);
    }

    function showGroupLabel(xPercent, text) {
        const label = document.createElement('div');
        label.className = 'group-label';
        label.style.left = xPercent + '%';
        label.innerText = text;
        document.getElementById('field').appendChild(label);
        setTimeout(() => label.remove(), ORGANIZE_DURATION);
    }

    document.querySelectorAll('.item-slot').forEach(el => {
        el.addEventListener('click', () => useItem(parseInt(el.dataset.idx)));
    });
    renderItemSlots();

    // ===== 입력 처리 =====
    // - 오브젝트를 누르면(탭이든 드래그든) 손을 떼는 순간 클릭 판정이 적용됨
    // - 얼음은 처음 누른 지점이 아이콘이었는지(coreHit) 아닌지에 따라 즉시제거/3회제거가 갈림
    // - 빈 공간을 누른 채 움직이면(스와이프) 지나가는 오브젝트들이 각각 클릭 판정을 받음
    const fieldEl = document.getElementById('field');

    fieldEl.addEventListener('pointerdown', (e) => {
        // 💣 아이템 효과 중: 어디를 터치하든 그 자리에서 폭발
        if (Date.now() < explosiveTouchUntil) {
            const rect = fieldEl.getBoundingClientRect();
            const x = Math.max(2, Math.min(98, (e.clientX - rect.left) / rect.width * 100));
            const y = Math.max(2, Math.min(98, (e.clientY - rect.top) / rect.height * 100));
            explodeAtPoint(x, y);
            return;
        }

        const obj = findEmojiFromElement(e.target);
        if (obj && !obj.removed && !obj.exploded) {
            pointerCandidate = { obj, startX: e.clientX, startY: e.clientY, dragging: false, coreHit: (e.target === obj.icon) };
            sweepActive = false;
        } else {
            pointerCandidate = null;
            sweepActive = true;
            sweepVisited = new Set();
        }
    });

    window.addEventListener('pointermove', (e) => {
        if (pointerCandidate) {
            const obj = pointerCandidate.obj;
            if (obj.removed || obj.exploded) { pointerCandidate = null; return; }

            if (!pointerCandidate.dragging) {
                const dx = e.clientX - pointerCandidate.startX;
                const dy = e.clientY - pointerCandidate.startY;
                if (Math.hypot(dx, dy) > DRAG_THRESHOLD) {
                    pointerCandidate.dragging = true;
                    obj.held = true;
                    obj.el.style.zIndex = 999;
                    obj.el.style.cursor = 'grabbing';
                }
            }

            if (pointerCandidate.dragging) {
                const rect = fieldEl.getBoundingClientRect();
                let x = (e.clientX - rect.left) / rect.width * 100;
                let y = (e.clientY - rect.top) / rect.height * 100;
                x = Math.max(2, Math.min(98, x));
                y = Math.max(2, Math.min(98, y));
                obj.x = x; obj.y = y;
                positionEl(obj);
            }
            return;
        }

        if (sweepActive) {
            const el2 = document.elementFromPoint(e.clientX, e.clientY);
            if (!el2) return;
            const obj2 = findEmojiFromElement(el2);
            if (obj2 && !obj2.removed && !obj2.exploded && !sweepVisited.has(obj2.id)) {
                sweepVisited.add(obj2.id);
                if (obj2.type === 'ice') hitNearbyIce(obj2, e.clientX, e.clientY, el2 === obj2.icon);
                else handleHit(obj2, el2 === obj2.icon);
            }
        }
    });

    function endPointer(e) {
        if (pointerCandidate) {
            const obj = pointerCandidate.obj;
            if (obj.held) {
                obj.held = false;
                obj.el.style.cursor = obj.type === 'bomb' ? 'grab' : 'pointer';
            }
            if (!obj.removed && !obj.exploded) {
                obj.el.style.zIndex = Z_INDEX[obj.type];
                if (obj.type === 'ice' && e) hitNearbyIce(obj, e.clientX, e.clientY, pointerCandidate.coreHit);
                else handleHit(obj, pointerCandidate.coreHit);
            }
            pointerCandidate = null;
        }
        sweepActive = false;
    }
    window.addEventListener('pointerup', endPointer);
    window.addEventListener('pointercancel', endPointer);
</script>
</body>
